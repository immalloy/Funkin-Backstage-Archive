<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Funkin' Backstage | Profile</title>
	<link rel="icon" type="image/png" href="../../favicon.png">
	<link rel="stylesheet" href="../../style.css" type="text/css">
	<link rel="stylesheet" href="../../mods/style.css" type="text/css">
	<style>
		body {
			display: block !important;
			overflow-y: hidden;
			min-height: 100vh;
			height: auto;
			padding: 0;
		}

		#profile-header {
			width: 100%;
			/* height: ; */
			background: #484660;
			border-bottom: 2px solid #E1E1E1;
			display: flex;
			align-items: center;
			gap: 2rem;
			padding: 2rem 3rem;
			box-sizing: border-box;
		}

		#avatar-wrapper {
			position: relative;
			width: 30vh;
			height: 30vh;
			flex-shrink: 0;
			border-radius: 50%;
			border: 2vh solid #E1E1E1;
			overflow: hidden;
		}

		#profile-avatar {
			width: 100%;
			height: 100%;
			object-fit: cover;
			background: #333;
			display: block;
			transition: filter 0.2s ease;
		}

		#avatar-overlay {
			position: absolute;
			inset: 0;
			border-radius: 50%;
			background: rgba(0,0,0,0);
			display: flex;
			align-items: center;
			justify-content: center;
			transition: background 0.2s ease;
			pointer-events: none;
		}

		#avatar-upload-icon {
			width: 35%;
			opacity: 0;
			transition: opacity 0.2s ease;
		}

		#avatar-wrapper.can-upload {
			cursor: pointer;
		}

		#avatar-wrapper.can-upload:hover #profile-avatar {
			filter: brightness(0.5);
		}

		#avatar-wrapper.can-upload:hover #avatar-overlay {
			background: rgba(0,0,0,0.3);
		}

		#avatar-wrapper.can-upload:hover #avatar-upload-icon {
			opacity: 1;
		}

		#profile-info {
			display: flex;
			flex-direction: column;
			gap: 0.3rem;
			min-width: 0;
		}

		#profile-username {
			font-family: 'FunkinLingLong', sans-serif;
			font-size: 12vh;
			color: #E1E1E1;
			margin: 0;
			line-height: 1;
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
		}

		#profile-bio {
			font-family: 'FunkinOptions', sans-serif;
			font-size: 4vh;
			color: #bbb;
			margin: 0;
			font-style: italic;
			white-space: normal;
			word-break: break-word;
			text-align: center;
		}

		#profile-stats {
			display: flex;
			gap: 2.5rem;
			align-items: flex-end;
			margin-left: auto;
		}

		.profile-stat {
			display: flex;
			flex-direction: column;
			align-items: center;
			line-height: 1;
		}

		.profile-stat-count {
			font-family: 'FunkinLingLong', sans-serif;
			font-size: 9vh;
			color: #E1E1E1;
			margin: 0;
		}

		.profile-stat-label {
			font-family: 'FunkinOptions', sans-serif;
			font-size: 2.4vh;
			color: #aaa;
			margin: 0;
			letter-spacing: 0.05em;
		}

		#profile-actions {
			display: none;
			flex-direction: column;
			gap: 0.5rem;
			margin-left: 2rem;
			flex-shrink: 0;
		}

		#profile-actions button {
			font-family: 'FunkinLingLong', sans-serif;
			font-size: 3.5vh;
			border-radius: 0.6rem;
			border: 2px solid #E1E1E1;
			cursor: pointer;
			padding: 0.6rem 2rem;
			color: #E1E1E1;
			letter-spacing: 0.05em;
		}

		#btn-follow {
			background: #5c5a78;
			width: 100%;
		}

		#btn-follow.following {
			background: #3a3855;
		}

		#profile-actions-row {
			display: flex;
			gap: 0.5rem;
		}

		#btn-block {
			background: #c94040;
			border-color: #c94040;
			flex: 1;
		}

		#btn-report {
			background: #222230;
			border-color: #E1E1E1;
			flex: 1;
		}

		#profile-bio-edit {
			display: none;
			gap: 0.5rem;
			align-items: center;
		}

		#profile-bio-input {
			background: transparent;
			border: none;
			border-bottom: 1px solid #777;
			outline: none;
			font-family: 'FunkinOptions', sans-serif;
			font-size: 1.8vh;
			color: #E1E1E1;
			font-style: italic;
			width: 30ch;
			caret-color: #E1E1E1;
		}

		#profile-bio-save {
			font-family: 'FunkinOptions', sans-serif;
			font-size: 1.6vh;
			color: #999;
			cursor: pointer;
			background: none;
			border: none;
			padding: 0;
		}
		#profile-bio-save:hover { color: #E1E1E1; }

		#btn-logout {
			display: none;
			margin-top: 0.6rem;
			width: fit-content;
			background: #111120;
			border: 1px solid #333;
			border-radius: 0.4rem;
			padding: 0.5rem 0.9rem;
			cursor: pointer;
			align-items: center;
			gap: 0.5rem;
			transition: border-color 0.15s, background 0.15s;
		}
		#btn-logout:hover { border-color: #f88; background: #1a0f0f; }
		#btn-logout img { height: 2.2vh; flex-shrink: 0; transition: filter 0.15s; }
		#btn-logout:hover img { filter: brightness(0) saturate(100%) invert(60%) sepia(80%) saturate(500%) hue-rotate(300deg); }
		#btn-logout span {
			font-family: 'FunkinOptions', sans-serif;
			font-size: 1.7vh;
			color: #999;
		}
		#btn-logout:hover span { color: #f88; }

		#profile-body {
			display: flex;
			flex-direction: row;
			align-items: flex-start;
			width: 100%;
			min-height: 70vh;
			position: relative;
			padding: 2rem 2.5rem;
			box-sizing: border-box;
			gap: 1.5rem;
			overflow: hidden;
		}

		#profile-sidebar {
			width: 24%;
			flex-shrink: 0;
			background: #1a1828;
			border-radius: 0.5rem;
			padding: 1.2rem 1rem;
			box-sizing: border-box;
			display: flex;
			flex-direction: column;
			gap: 0.2rem;
		}

		.social-row {
			display: flex;
			align-items: center;
			gap: 1rem;
			padding: 0.7rem 0.8rem;
			border-radius: 0.4rem;
			text-decoration: none;
			transition: background 0.15s;
			cursor: pointer;
		}

		.social-row:hover { background: rgba(255,255,255,0.06); }

		.social-icon {
			width: 3.8rem;
			height: 3.8rem;
			border-radius: 0.5rem;
			flex-shrink: 0;
			object-fit: cover;
		}

		.social-text { display: flex; flex-direction: column; min-width: 0; }

		.social-name {
			font-family: 'FunkinLingLong', sans-serif;
			font-size: 2.8vh;
			color: #E1E1E1;
			line-height: 1.1;
		}

		.social-handle {
			font-family: 'FunkinOptions', sans-serif;
			font-size: 1.7vh;
			color: #888;
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
		}

		#socials-edit-btn {
			margin-top: auto;
			font-family: 'FunkinOptions', sans-serif;
			font-size: 1.6vh;
			color: #777;
			background: none;
			border: 1px solid #333;
			border-radius: 0.4rem;
			padding: 0.4rem 0.8rem;
			cursor: pointer;
			width: 100%;
			display: none;
		}
		#socials-edit-btn:hover { color: #E1E1E1; border-color: #666; }

		#logout-modal {
			display: none;
			position: fixed;
			inset: 0;
			background: rgba(0,0,0,0.7);
			z-index: 100;
			align-items: center;
			justify-content: center;
		}
		#logout-modal.open { display: flex; }
		#logout-modal-box {
			background: #1a1828;
			border: 1px solid #333;
			border-radius: 0.6rem;
			padding: 1.8rem 2.2rem;
			display: flex;
			flex-direction: column;
			gap: 1.2rem;
			align-items: center;
			width: 280px;
		}
		#logout-modal-box p {
			font-family: 'FunkinLingLong', sans-serif;
			font-size: 3vh;
			color: #E1E1E1;
			margin: 0;
			text-align: center;
		}
		#logout-modal-btns { display: flex; gap: 0.8rem; width: 100%; }
		#logout-modal-btns button {
			flex: 1;
			font-family: 'FunkinLingLong', sans-serif;
			font-size: 2.2vh;
			border-radius: 0.4rem;
			padding: 0.5rem;
			cursor: pointer;
			border: 1px solid #555;
		}
		#logout-confirm { background: #c94040; border-color: #c94040; color: #fff; }
		#logout-confirm:hover { background: #a83030; }
		#logout-cancel { background: #22223a; color: #E1E1E1; }
		#logout-cancel:hover { background: #2e2c4a; }

		#socials-edit-modal {
			display: none;
			position: fixed;
			inset: 0;
			background: rgba(0,0,0,0.7);
			z-index: 100;
			align-items: center;
			justify-content: center;
		}
		#socials-edit-modal.open { display: flex; }

		#socials-edit-box {
			background: #1a1828;
			border: 1px solid #333;
			border-radius: 0.6rem;
			padding: 2rem 2.5rem;
			width: 380px;
			display: flex;
			flex-direction: column;
			gap: 0.9rem;
		}

		#socials-edit-box h3 {
			font-family: 'FunkinLingLong', sans-serif;
			font-size: 3vh;
			color: #E1E1E1;
			margin: 0 0 0.6rem;
		}

		.social-edit-row {
			display: flex;
			align-items: center;
			gap: 0.6rem;
		}

		.social-edit-row img {
			width: 2rem;
			height: 2rem;
			border-radius: 0.3rem;
			flex-shrink: 0;
		}

		.social-edit-row input {
			flex: 1;
			background: #0d0d14;
			border: 1px solid #333;
			border-radius: 0.3rem;
			padding: 0.35rem 0.6rem;
			color: #E1E1E1;
			font-family: 'FunkinOptions', sans-serif;
			font-size: 1.5vh;
			outline: none;
		}
		.social-edit-row input:focus { border-color: #555; }

		#socials-save-btn {
			font-family: 'FunkinLingLong', sans-serif;
			font-size: 2.2vh;
			color: #E1E1E1;
			background: #2e2c4a;
			border: 1px solid #555;
			border-radius: 0.4rem;
			padding: 0.5rem;
			cursor: pointer;
			margin-top: 0.4rem;
		}
		#socials-save-btn:hover { background: #3a3860; }

		#profile-content {
			display: flex;
			flex-direction: column;
			min-width: 0;
		}

		#mods-box {
			background: #1a1828;
			border-radius: 0.5rem;
			padding: 1.5rem 2rem;
			min-height: 60vh;
		}

		#mods-box h2 {
			font-family: 'FunkinLingLong', sans-serif;
			font-size: 5vh;
			color: #E1E1E1;
			margin: 0 0 1rem 0;
			text-align: center;
			letter-spacing: 0.05em;
		}

		#profile-content-col {
			flex: 0 0 auto;
			width: 45%;
			position: relative;
		}

		#profile-badge {
			display: none;
			position: absolute;
			top: 0.5rem;
			right: -10rem;
			width: 9rem;
			flex-direction: column;
			gap: 0.5rem;
		}

		#profile-badge img {
			width: 100%;
			display: block;
		}

		#mods-box {
			overflow-y: auto;
			scrollbar-width: none;
			position: relative;
		}
		#mods-box::-webkit-scrollbar { display: none; }

		#mods-scroll-track {
			position: absolute;
			right: 0.5rem;
			top: 1rem;
			bottom: 1rem;
			width: 1.4rem;
			background: url('scroll-bar.png') center/contain repeat-y;
			display: none;
			cursor: pointer;
		}

		#mods-scroll-knob {
			position: absolute;
			left: 50%;
			transform: translateX(-50%);
			width: 1.4rem;
			height: 2.5rem;
			background: url('scroll-knob.png') center/contain no-repeat;
			cursor: grab;
		}

		#mods-grid {
			display: grid;
			grid-template-columns: repeat(2, 1fr);
			gap: 1.2rem;
			padding-right: 0.5rem;
		}

		.mod-card {
			border-radius: 0.5rem;
			overflow: hidden;
			cursor: pointer;
			transition: transform 0.15s;
			text-decoration: none;
		}
		.mod-card:hover { transform: scale(1.02); }

		.mod-thumb-wrap {
			position: relative;
			width: 100%;
			aspect-ratio: 16/9;
			background: #111;
			overflow: hidden;
		}

		.mod-thumb {
			position: absolute;
			inset: 4px;
			width: calc(100% - 8px);
			height: calc(100% - 8px);
			object-fit: cover;
			display: block;
		}

		.mod-thumb-outline {
			position: absolute;
			inset: 0;
			width: 100%;
			height: 100%;
			pointer-events: none;
		}

		.mod-card-info {
			padding: 0.7rem 1rem 0.9rem;
			background: #111120;
		}

		.mod-card-title {
			font-family: 'FunkinLingLong', sans-serif;
			font-size: 2.8vh;
			color: #E1E1E1;
			margin: 0;
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
		}

		.mod-card-blurb {
			font-family: 'FunkinOptions', sans-serif;
			font-size: 1.8vh;
			color: #888;
			margin: 0.2rem 0 0;
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
			font-weight: normal;
		}

		#profile-char {
			position: absolute;
			right: 4vw;
			bottom: 0;
			height: 92%;
			pointer-events: none;
			user-select: none;
		}

		#profile-badge-mobile {
			display: none;
		}

		@media (max-width: 768px) {
			body { overflow-y: auto; }

			#profile-header {
				padding: 1.2rem;
				gap: 1rem;
				flex-wrap: wrap;
			}

			#avatar-wrapper {
				width: 18vw;
				height: 18vw;
				border-width: 1vw;
			}

			#profile-info { align-items: center; }
			#profile-username { font-size: 7vw; text-align: center; }
			#profile-bio { font-size: 3.5vw; }

			#profile-badge-mobile {
				display: flex;
				flex-direction: row;
				flex-wrap: wrap;
				gap: 0.5rem;
				padding-bottom: 0.4rem;
			}
			#profile-badge-mobile img { width: 4.5rem; }

			#profile-badge { display: none !important; }

			#profile-stats {
				gap: 1.2rem;
				margin-left: 0;
				order: 3;
				width: 100%;
				justify-content: center;
			}

			.profile-stat-count { font-size: 6vw; }
			.profile-stat-label { font-size: 2.5vw; }

			#profile-actions { margin-left: 0; }

			#profile-body {
				flex-direction: column;
				padding: 1rem;
				overflow: visible;
			}

			#profile-sidebar { width: 100%; }
			#profile-content-col { width: 100%; }

			#mods-grid { grid-template-columns: 1fr; }

			#mods-box { min-height: unset; }

			#mods-box h2 { font-size: 6vw; }
			.mod-card-title { font-size: 4vw; }
			.mod-card-blurb { font-size: 3vw; }

			#profile-char { display: none; }
		}
	</style>
</head>
<body>
	<input id="avatar-input" type="file" accept="image/png,image/jpeg,image/webp,image/gif" style="display:none;">
	<div id="profile-header">
		<div id="avatar-wrapper">
			<img id="profile-avatar" draggable="false" src="">
			<div id="avatar-overlay">
				<img src="upload-button.png" draggable="false" id="avatar-upload-icon">
			</div>
		</div>
		<div id="profile-info">
			<h1 id="profile-username">...</h1>
			<p id="profile-bio"></p>
			<div id="profile-bio-edit">
				<input id="profile-bio-input" type="text" maxlength="30" placeholder="add a bio...">
				<button id="profile-bio-save" type="button">save</button>
			</div>
			<button id="btn-logout" type="button"><img src="icon-logout.png" draggable="false" alt=""><span>Log Out</span></button>
			<div id="profile-badge-mobile"></div>
		</div>
		<div id="profile-stats">
			<div class="profile-stat">
				<h1 class="profile-stat-count" id="stat-followers">0</h1>
				<p class="profile-stat-label">FOLLOWERS</p>
			</div>
			<div class="profile-stat">
				<h1 class="profile-stat-count" id="stat-following">0</h1>
				<p class="profile-stat-label">FOLLOWING</p>
			</div>
		</div>
		<div id="profile-actions">
			<button id="btn-follow" type="button">FOLLOW</button>
			<div id="profile-actions-row" style="display:none;">
				<button id="btn-block" type="button">BLOCK</button>
				<button id="btn-report" type="button">REPORT</button>
			</div>
		</div>
	</div>
	<div id="logout-modal">
		<div id="logout-modal-box">
			<p>Log out?</p>
			<div id="logout-modal-btns">
				<button id="logout-cancel" type="button">CANCEL</button>
				<button id="logout-confirm" type="button">LOG OUT</button>
			</div>
		</div>
	</div>

	<div id="socials-edit-modal">
		<div id="socials-edit-box">
			<h3>Edit Socials</h3>
			<div class="social-edit-row"><img src="icon-youtube.png"><input id="edit-youtube" placeholder="youtube.com/@you"></div>
			<div class="social-edit-row"><img src="icon-twitter.png"><input id="edit-twitter" placeholder="x.com/you"></div>
			<div class="social-edit-row"><img src="icon-newgrounds.png"><input id="edit-newgrounds" placeholder="you.newgrounds.com"></div>
			<div class="social-edit-row"><img src="icon-discord.png"><input id="edit-discord" placeholder="username"></div>
			<div class="social-edit-row"><img src="icon-kofi.png"><input id="edit-kofi" placeholder="ko-fi.com/you"></div>
			<button id="socials-save-btn" type="button">SAVE</button>
		</div>
	</div>

	<div id="profile-body">
		<div id="profile-sidebar">
			<a class="social-row" id="social-youtube" href="#" target="_blank" rel="noopener">
				<img class="social-icon" src="icon-youtube.png" draggable="false">
				<div class="social-text"><span class="social-name">YOUTUBE</span><span class="social-handle" id="handle-youtube"></span></div>
			</a>
			<a class="social-row" id="social-twitter" href="#" target="_blank" rel="noopener">
				<img class="social-icon" src="icon-twitter.png" draggable="false">
				<div class="social-text"><span class="social-name">TWITTER</span><span class="social-handle" id="handle-twitter"></span></div>
			</a>
			<a class="social-row" id="social-newgrounds" href="#" target="_blank" rel="noopener">
				<img class="social-icon" src="icon-newgrounds.png" draggable="false">
				<div class="social-text"><span class="social-name">NEWGROUNDS</span><span class="social-handle" id="handle-newgrounds"></span></div>
			</a>
			<div class="social-row" id="social-discord" style="cursor:default;">
				<img class="social-icon" src="icon-discord.png" draggable="false">
				<div class="social-text"><span class="social-name">DISCORD</span><span class="social-handle" id="handle-discord"></span></div>
			</div>
			<a class="social-row" id="social-kofi" href="#" target="_blank" rel="noopener">
				<img class="social-icon" src="icon-kofi.png" draggable="false">
				<div class="social-text"><span class="social-name">KO-FI</span><span class="social-handle" id="handle-kofi"></span></div>
			</a>
			<button id="socials-edit-btn" type="button">edit socials</button>
		</div>
		<div id="profile-content-col">
			<div id="profile-content">
				<div id="mods-box">
					<h2>SUBMITTED MODS</h2>
					<div id="mods-grid"></div>
					<div id="mods-scroll-track"><div id="mods-scroll-knob"></div></div>
				</div>
			</div>
			<div id="profile-badge"></div>
		</div>
		<img id="profile-char" src="bf-char.png" draggable="false" alt="">
	</div>

	<p class="footer-left" style="position:fixed;bottom:1rem;left:1rem;font-family:'Inconsolata ExtraBold',sans-serif;font-size:1.25rem;color:#666;"></p>
	<p class="footer-right" style="position:fixed;bottom:1rem;right:1rem;font-family:'Inconsolata ExtraBold',sans-serif;font-size:1.25rem;color:#666;text-align:right;"></p>

	<script src="../../api.js"></script>
	<script src="../../script.js"></script>
	<script>
		async function loadProfile() {
			const userId = Number(sessionStorage.getItem('userId'));
			if (!userId) { document.getElementById('profile-username').textContent = 'Unknown'; return; }

			const token = localStorage.getItem('token');
			let me = null;
			if (token) {
				const meRes = await fetch(`${API}/me`, {
					method: 'POST',
					headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
					body: JSON.stringify({})
				});
				if (meRes.ok) me = await meRes.json();
			}

			const user = await fetch(`${API}/users/${userId}`).then(r => r.ok ? r.json() : null);
			if (!user) { document.getElementById('profile-username').textContent = 'User not found'; return; }

			document.title = `${user.username} — Funkin' Backstage`;
			try { history.replaceState(null, '', '/users/' + userId); } catch (e) {}
			loadMods(userId);

			const badgeEl = document.getElementById('profile-badge');
			const badges = [];
			if (user.isAdmin) badges.push(userId === 2
				? 'https://files.funkinbackstage.com/badges/owner-badge.png'
				: 'https://files.funkinbackstage.com/badges/mod-badge.png');
			if (user.ogMember) badges.push('https://files.funkinbackstage.com/badges/og-badge.png');
			if (badges.length) {
				const badgeHTML = badges.map(src => `<img src="${src}" draggable="false" alt="badge">`).join('');
				badgeEl.innerHTML = badgeHTML;
				badgeEl.style.display = 'flex';
				document.getElementById('profile-badge-mobile').innerHTML = badgeHTML;
			}
			const usernameEl = document.getElementById('profile-username');
			usernameEl.textContent = user.username;

			const avatarEl = document.getElementById('profile-avatar');
			document.getElementById('stat-followers').textContent = (user.followers ?? []).length;
			document.getElementById('stat-following').textContent = (user.following ?? []).length;

			const avatarTs = localStorage.getItem(`avatarTs_${userId}`) || Date.now();
			avatarEl.src = `${API}/avatars/${userId}.png?t=${avatarTs}`;
			avatarEl.onerror = () => { avatarEl.src = ''; avatarEl.style.background = '#444'; };

			const bioEl = document.getElementById('profile-bio');
			if (user.bio) {
				bioEl.textContent = `"${user.bio}"`;
				bioEl.style.maxWidth = usernameEl.offsetWidth + 'px';
			} else {
				bioEl.style.display = 'none';
			}

			if (me && me.id !== userId) {
				const actions = document.getElementById('profile-actions');
				actions.style.display = 'flex';
				const followBtn = document.getElementById('btn-follow');
				const isFollowing = (user.followers ?? []).includes(me.id);
				if (isFollowing) { followBtn.textContent = 'FOLLOWING'; followBtn.classList.add('following'); }
				followBtn.onclick = async () => {
					const res = await fetch(`${API}/users/${userId}/follow`, {
						method: 'POST',
						headers: { 'Authorization': `Bearer ${token}` }
					});
					if (!res.ok) return;
					const data = await res.json();
					document.getElementById('stat-followers').textContent = data.followers;
					if (data.isFollowing) { followBtn.textContent = 'FOLLOWING'; followBtn.classList.add('following'); }
					else { followBtn.textContent = 'FOLLOW'; followBtn.classList.remove('following'); }
				};
			}

			const SOCIALS = [
				{ key: 'youtube',     label: 'YOUTUBE',     prefix: 'https://' },
				{ key: 'twitter',     label: 'TWITTER',     prefix: 'https://' },
				{ key: 'newgrounds',  label: 'NEWGROUNDS',  prefix: 'https://' },
				{ key: 'discord',     label: 'DISCORD',     prefix: null },
				{ key: 'kofi',        label: 'KO-FI',       prefix: 'https://' },
			];
			const socials = user.socials || {};
			function applySocials(data) {
				let anyVisible = false;
				SOCIALS.forEach(({ key }) => {
					const row = document.getElementById(`social-${key}`);
					const handle = document.getElementById(`handle-${key}`);
					const val = (data[key] || '').trim();
					if (val) {
						handle.textContent = val;
						if (row.tagName === 'A') row.href = val.startsWith('http') ? val : `https://${val}`;
						row.style.display = '';
						anyVisible = true;
					} else {
						row.style.display = 'none';
					}
				});
				document.getElementById('profile-sidebar').style.visibility = anyVisible || (me && me.id === userId) ? '' : 'hidden';
			}
			applySocials(socials);

			if (me && me.id === userId) {
				const editBtn = document.getElementById('socials-edit-btn');
				editBtn.style.display = 'block';
				editBtn.onclick = () => {
					SOCIALS.forEach(({ key }) => {
						document.getElementById(`edit-${key}`).value = socials[key] || '';
					});
					document.getElementById('socials-edit-modal').classList.add('open');
				};
				document.getElementById('socials-edit-modal').addEventListener('click', e => {
					if (e.target === document.getElementById('socials-edit-modal'))
						document.getElementById('socials-edit-modal').classList.remove('open');
				});
				document.getElementById('socials-save-btn').onclick = async () => {
					const newSocials = {};
					SOCIALS.forEach(({ key }) => {
						const v = document.getElementById(`edit-${key}`).value.trim();
						if (v) newSocials[key] = v;
					});
					const res = await fetch(`${API}/users/me`, {
						method: 'PATCH',
						headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
						body: JSON.stringify({ socials: newSocials })
					});
					if (res.ok) {
						Object.assign(socials, newSocials);
						SOCIALS.forEach(({ key }) => { if (!newSocials[key]) delete socials[key]; });
						applySocials(socials);
						document.getElementById('socials-edit-modal').classList.remove('open');
					}
				};
			}

			if (me && me.id === userId) {
				const avatarWrapper = document.getElementById('avatar-wrapper');
				avatarWrapper.classList.add('can-upload');
				const avatarInput = document.getElementById('avatar-input');
				avatarWrapper.onclick = () => avatarInput.click();
				avatarInput.onchange = async () => {
					const file = avatarInput.files[0];
					if (!file) return;
					const res = await fetch(`${API}/avatars/me`, {
						method: 'POST',
						headers: { 'Content-Type': file.type, 'Authorization': `Bearer ${token}` },
						body: file
					});
					if (res.ok) {
						const t = Date.now();
						localStorage.setItem(`avatarTs_${userId}`, t);
						avatarEl.src = `${API}/avatars/${userId}.png?t=${t}`;
					}
					avatarInput.value = '';
				};

				const editRow = document.getElementById('profile-bio-edit');
				editRow.style.display = 'flex';
				const input = document.getElementById('profile-bio-input');
				input.value = user.bio || '';
				input.placeholder = user.bio ? 'edit bio...' : 'add a bio...';

				const logoutBtn = document.getElementById('btn-logout');
				logoutBtn.style.display = 'flex';
				const logoutModal = document.getElementById('logout-modal');
				logoutBtn.onclick = () => logoutModal.classList.add('open');
				document.getElementById('logout-cancel').onclick = () => logoutModal.classList.remove('open');
				document.getElementById('logout-confirm').onclick = () => {
					localStorage.removeItem('token');
					window.location.href = 'https://funkinbackstage.com/mods';
				};
				logoutModal.addEventListener('click', e => { if (e.target === logoutModal) logoutModal.classList.remove('open'); });

				document.getElementById('profile-bio-save').onclick = async () => {
					const newBio = input.value.trim();
					const res = await fetch(`${API}/users/me`, {
						method: 'PATCH',
						headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
						body: JSON.stringify({ bio: newBio })
					});
					if (res.ok) {
						bioEl.textContent = newBio ? `"${newBio}"` : '';
						bioEl.style.display = newBio ? '' : 'none';
						input.value = newBio;
					}
				};
			}
		}

		async function loadMods(userId) {
			const grid = document.getElementById('mods-grid');
			const box = document.getElementById('mods-box');
			const track = document.getElementById('mods-scroll-track');
			const knob = document.getElementById('mods-scroll-knob');

			let ids;
			try { ids = await fetch(`${API}/submissions`).then(r => r.json()); }
			catch { return; }

			const metas = (await Promise.all(ids.map(id =>
				fetch(`${API}/submissions/${id}/meta.json`).then(r => r.ok ? r.json().then(m => ({ ...m, _folderId: id })) : null).catch(() => null)
			))).filter(m => m && m.submitter === userId && m.live !== false);

			if (!metas.length) {
				grid.innerHTML = '<p style="font-family:\'FunkinOptions\',sans-serif;color:#555;font-size:2vh;text-align:center;margin-top:2rem;">No mods yet.</p>';
				return;
			}

			metas.sort((a, b) => (b.activity || 0) - (a.activity || 0));

			grid.innerHTML = metas.map(m => {
				const thumb = (m.thumbnails || []).find(t => !/\.(mp4|webm|mov|ogg)(\?.*)?$/i.test(t)) || '';
				const blurb = m.blurb || '';
				return `<a class="mod-card" href="https://funkinbackstage.com/mods/${m._folderId}">
					<div class="mod-thumb-wrap">
						${thumb ? `<img class="mod-thumb" src="${thumb}" loading="lazy" draggable="false">` : ''}
						<img class="mod-thumb-outline" src="/users/view/thumbnail-outline.png" draggable="false">
					</div>
					<div class="mod-card-info">
						<p class="mod-card-title">${escapeHTML(m.title)}</p>
						${blurb ? `<p class="mod-card-blurb">${escapeHTML(blurb)}</p>` : ''}
					</div>
				</a>`;
			}).join('');

			function updateScroll() {
				const scrollable = box.scrollHeight > box.clientHeight + 2;
				track.style.display = scrollable ? '' : 'none';
				if (!scrollable) return;
				const ratio = box.scrollTop / (box.scrollHeight - box.clientHeight);
				const trackH = track.clientHeight - knob.clientHeight;
				knob.style.top = (ratio * trackH) + 'px';
			}

			box.addEventListener('scroll', updateScroll);
			window.addEventListener('resize', updateScroll);
			setTimeout(updateScroll, 100);

			let dragging = false, startY = 0, startScroll = 0;
			knob.addEventListener('mousedown', e => {
				dragging = true; startY = e.clientY; startScroll = box.scrollTop; e.preventDefault();
			});
			document.addEventListener('mousemove', e => {
				if (!dragging) return;
				const trackH = track.clientHeight - knob.clientHeight;
				const delta = (e.clientY - startY) / trackH * (box.scrollHeight - box.clientHeight);
				box.scrollTop = Math.max(0, startScroll + delta);
			});
			document.addEventListener('mouseup', () => { dragging = false; });
			track.addEventListener('click', e => {
				if (e.target === knob) return;
				const rect = track.getBoundingClientRect();
				const ratio = (e.clientY - rect.top) / rect.height;
				box.scrollTop = ratio * (box.scrollHeight - box.clientHeight);
			});
		}

		function escapeHTML(s) {
			return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
		}

		loadProfile();
	</script>
</body>
</html>
