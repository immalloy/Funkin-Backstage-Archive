<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Funkin' Backstage | Profile</title>
	<link rel="icon" type="image/png" href="../../favicon.png">
	<link rel="stylesheet" href="../../style.css" type="text/css">
	<link rel="stylesheet" href="../../mods/style.css" type="text/css">
	<style>
		body {
			display: block !important;
			overflow-y: auto;
			min-height: 100vh;
			height: auto;
			padding: 0;
		}

		#profile-header {
			width: 100%;
			/* height: ; */
			background: #484660;
			border-bottom: 2px solid #E1E1E1;
			display: flex;
			align-items: center;
			gap: 2rem;
			padding: 2rem 3rem;
			box-sizing: border-box;
		}

		#avatar-wrapper {
			position: relative;
			width: 30vh;
			height: 30vh;
			flex-shrink: 0;
			border-radius: 50%;
			border: 2vh solid #E1E1E1;
			overflow: hidden;
		}

		#profile-avatar {
			width: 100%;
			height: 100%;
			object-fit: cover;
			background: #333;
			display: block;
			transition: filter 0.2s ease;
		}

		#avatar-overlay {
			position: absolute;
			inset: 0;
			border-radius: 50%;
			background: rgba(0,0,0,0);
			display: flex;
			align-items: center;
			justify-content: center;
			transition: background 0.2s ease;
			pointer-events: none;
		}

		#avatar-upload-icon {
			width: 35%;
			opacity: 0;
			transition: opacity 0.2s ease;
		}

		#avatar-wrapper.can-upload {
			cursor: pointer;
		}

		#avatar-wrapper.can-upload:hover #profile-avatar {
			filter: brightness(0.5);
		}

		#avatar-wrapper.can-upload:hover #avatar-overlay {
			background: rgba(0,0,0,0.3);
		}

		#avatar-wrapper.can-upload:hover #avatar-upload-icon {
			opacity: 1;
		}

		#profile-info {
			display: flex;
			flex-direction: column;
			gap: 0.3rem;
			min-width: 0;
		}

		#profile-username {
			font-family: 'FunkinLingLong', sans-serif;
			font-size: 12vh;
			color: #E1E1E1;
			margin: 0;
			line-height: 1;
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
		}

		#profile-bio {
			font-family: 'FunkinOptions', sans-serif;
			font-size: 4vh;
			color: #bbb;
			margin: 0;
			font-style: italic;
			white-space: normal;
			word-break: break-word;
			text-align: center;
		}

		#profile-stats {
			display: flex;
			gap: 2.5rem;
			align-items: flex-end;
			margin-left: 2rem;
		}

		.profile-stat {
			display: flex;
			flex-direction: column;
			align-items: center;
			line-height: 1;
		}

		.profile-stat-count {
			font-family: 'FunkinLingLong', sans-serif;
			font-size: 6vh;
			color: #E1E1E1;
			margin: 0;
		}

		.profile-stat-label {
			font-family: 'FunkinOptions', sans-serif;
			font-size: 1.8vh;
			color: #aaa;
			margin: 0;
			letter-spacing: 0.05em;
		}

		#profile-actions {
			display: none;
			flex-direction: column;
			gap: 0.5rem;
			margin-left: auto;
			flex-shrink: 0;
		}

		#profile-actions button {
			font-family: 'FunkinLingLong', sans-serif;
			font-size: 2.5vh;
			border-radius: 0.6rem;
			border: 2px solid #E1E1E1;
			cursor: pointer;
			padding: 0.4rem 1.2rem;
			color: #E1E1E1;
			letter-spacing: 0.05em;
		}

		#btn-follow {
			background: #5c5a78;
			width: 100%;
		}

		#btn-follow.following {
			background: #3a3855;
		}

		#profile-actions-row {
			display: flex;
			gap: 0.5rem;
		}

		#btn-block {
			background: #c94040;
			border-color: #c94040;
			flex: 1;
		}

		#btn-report {
			background: #222230;
			border-color: #E1E1E1;
			flex: 1;
		}

		#profile-bio-edit {
			display: none;
			gap: 0.5rem;
			align-items: center;
		}

		#profile-bio-input {
			background: transparent;
			border: none;
			border-bottom: 1px solid #777;
			outline: none;
			font-family: 'FunkinOptions', sans-serif;
			font-size: 1.8vh;
			color: #E1E1E1;
			font-style: italic;
			width: 30ch;
			caret-color: #E1E1E1;
		}

		#profile-bio-save {
			font-family: 'FunkinOptions', sans-serif;
			font-size: 1.6vh;
			color: #999;
			cursor: pointer;
			background: none;
			border: none;
			padding: 0;
		}
		#profile-bio-save:hover { color: #E1E1E1; }

		#profile-content {
			padding: 2rem 3rem;
			box-sizing: border-box;
			width: 100%;
		}

		@media (max-width: 768px) {
			#profile-header {
				padding: 1.5rem;
				gap: 1.2rem;
			}
			#profile-content {
				padding: 1.5rem;
			}
		}
	</style>
</head>
<body>
	<input id="avatar-input" type="file" accept="image/png,image/jpeg,image/webp,image/gif" style="display:none;">
	<div id="profile-header">
		<div id="avatar-wrapper">
			<img id="profile-avatar" draggable="false" src="">
			<div id="avatar-overlay">
				<img src="upload-button.png" draggable="false" id="avatar-upload-icon">
			</div>
		</div>
		<div id="profile-info">
			<h1 id="profile-username">...</h1>
			<p id="profile-bio"></p>
			<div id="profile-bio-edit">
				<input id="profile-bio-input" type="text" maxlength="30" placeholder="add a bio...">
				<button id="profile-bio-save" type="button">save</button>
			</div>
		</div>
		<div id="profile-stats">
			<div class="profile-stat">
				<h1 class="profile-stat-count" id="stat-followers">0</h1>
				<p class="profile-stat-label">FOLLOWERS</p>
			</div>
			<div class="profile-stat">
				<h1 class="profile-stat-count" id="stat-following">0</h1>
				<p class="profile-stat-label">FOLLOWING</p>
			</div>
		</div>
		<div id="profile-actions">
			<button id="btn-follow" type="button">FOLLOW</button>
			<div id="profile-actions-row">
				<button id="btn-block" type="button">BLOCK</button>
				<button id="btn-report" type="button">REPORT</button>
			</div>
		</div>
	</div>
	<div id="profile-content"></div>

	<p class="footer-left" style="position:fixed;bottom:1rem;left:1rem;font-family:'Inconsolata ExtraBold',sans-serif;font-size:1.25rem;color:#666;"></p>
	<p class="footer-right" style="position:fixed;bottom:1rem;right:1rem;font-family:'Inconsolata ExtraBold',sans-serif;font-size:1.25rem;color:#666;text-align:right;"></p>

	<script src="../../api.js"></script>
	<script src="../../script.js"></script>
	<script>
		async function loadProfile() {
			const userId = Number(sessionStorage.getItem('userId'));
			if (!userId) { document.getElementById('profile-username').textContent = 'Unknown'; return; }

			const token = localStorage.getItem('token');
			let me = null;
			if (token) {
				const meRes = await fetch(`${API}/me`, {
					method: 'POST',
					headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
					body: JSON.stringify({})
				});
				if (meRes.ok) me = await meRes.json();
			}

			const user = await fetch(`${API}/users/${userId}`).then(r => r.ok ? r.json() : null);
			if (!user) { document.getElementById('profile-username').textContent = 'User not found'; return; }

			document.title = `${user.username} — Funkin' Backstage`;
			try { history.replaceState(null, '', '/users/' + userId); } catch (e) {}
			const usernameEl = document.getElementById('profile-username');
			usernameEl.textContent = user.username;

			const avatarEl = document.getElementById('profile-avatar');
			document.getElementById('stat-followers').textContent = (user.followers ?? []).length;
			document.getElementById('stat-following').textContent = (user.following ?? []).length;

			const avatarTs = localStorage.getItem(`avatarTs_${userId}`) || Date.now();
			avatarEl.src = `${API}/avatars/${userId}.png?t=${avatarTs}`;
			avatarEl.onerror = () => { avatarEl.src = ''; avatarEl.style.background = '#444'; };

			const bioEl = document.getElementById('profile-bio');
			if (user.bio) {
				bioEl.textContent = `"${user.bio}"`;
				bioEl.style.maxWidth = usernameEl.offsetWidth + 'px';
			} else {
				bioEl.style.display = 'none';
			}

			if (me && me.id !== userId) {
				const actions = document.getElementById('profile-actions');
				actions.style.display = 'flex';
				const followBtn = document.getElementById('btn-follow');
				const isFollowing = (user.followers ?? []).includes(me.id);
				if (isFollowing) { followBtn.textContent = 'FOLLOWING'; followBtn.classList.add('following'); }
				followBtn.onclick = async () => {
					const res = await fetch(`${API}/users/${userId}/follow`, {
						method: 'POST',
						headers: { 'Authorization': `Bearer ${token}` }
					});
					if (!res.ok) return;
					const data = await res.json();
					document.getElementById('stat-followers').textContent = data.followers;
					if (data.isFollowing) { followBtn.textContent = 'FOLLOWING'; followBtn.classList.add('following'); }
					else { followBtn.textContent = 'FOLLOW'; followBtn.classList.remove('following'); }
				};
			}

			if (me && me.id === userId) {
				const avatarWrapper = document.getElementById('avatar-wrapper');
				avatarWrapper.classList.add('can-upload');
				const avatarInput = document.getElementById('avatar-input');
				avatarWrapper.onclick = () => avatarInput.click();
				avatarInput.onchange = async () => {
					const file = avatarInput.files[0];
					if (!file) return;
					const res = await fetch(`${API}/avatars/me`, {
						method: 'POST',
						headers: { 'Content-Type': file.type, 'Authorization': `Bearer ${token}` },
						body: file
					});
					if (res.ok) {
						const t = Date.now();
						localStorage.setItem(`avatarTs_${userId}`, t);
						avatarEl.src = `${API}/avatars/${userId}.png?t=${t}`;
					}
					avatarInput.value = '';
				};

				const editRow = document.getElementById('profile-bio-edit');
				editRow.style.display = 'flex';
				const input = document.getElementById('profile-bio-input');
				input.value = user.bio || '';
				input.placeholder = user.bio ? 'edit bio...' : 'add a bio...';

				document.getElementById('profile-bio-save').onclick = async () => {
					const newBio = input.value.trim();
					const res = await fetch(`${API}/users/me`, {
						method: 'PATCH',
						headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
						body: JSON.stringify({ bio: newBio })
					});
					if (res.ok) {
						bioEl.textContent = newBio ? `"${newBio}"` : '';
						bioEl.style.display = newBio ? '' : 'none';
						input.value = newBio;
					}
				};
			}
		}

		loadProfile();
	</script>
</body>
</html>
