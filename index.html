<!DOCTYPE html>
<html lang="en" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Funkin' Backstage</title>

  <meta property="og:title" content="Funkin' Backstage" />
  <meta property="og:description" content="For Modders. By Modders." />
  <meta property="og:image" content="https://funkinbackstage.com/favicon.png" />
  <meta name="theme-color" content="#ad0054" />

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="style.css" type="text/css">
  <style>
    @media (min-aspect-ratio: 16/9) {
      #portrait { right: 25%; height: 45vh; }
    }

    @media (max-width: 768px) {
      html, body { overflow: hidden; }
      body { align-items: flex-start; justify-content: center; padding-top: 10vh; }
      h1 { font-size: 2.5rem; text-align: center; }
      p:not(.footer-left):not(.footer-right) { font-size: 1.6rem; }
      .footer-left, .footer-right { font-size: 0.75rem !important; }
      .container div { display: flex !important; flex-direction: column; align-items: center; gap: 1rem; }
      .container div img { height: 2.5rem !important; }
      #portrait { height: 28vh !important; bottom: 0rem !important; }
    }
  </style>
</head>
<body>
  <div class="irisEffect" style="z-index: 100000;"></div>
  <script src="script.js"></script>
  <img draggable="false" src="right light.png" alt="Description" style="position: fixed; top: 0px; right: 0px; z-index: 1000; width: 25vw">
  <img draggable="false" src="left light.png" alt="Description" style="position: fixed; top: 0px; left: 0px; z-index: 1000; width: 25vw">
  <div class="container" style="position:relative;z-index:101;">
    <h1 style="font-family: 'FunkinLingLong', sans-serif;">Funkin' Backstage</h1>
    <p style="font-family: 'FunkinOptions', sans-serif;">For Modders. By Modders.</p>
    <div style="display: block; margin: 1rem auto 0;">
      <a href="global-chat"><img src="global-chat-button.png" class="smooth-btn" alt="Global Chat" style="height: 4rem; margin-right: 20px; cursor: pointer;"></a>
      <a href="mods">
        <img src="discover mods.png" class="smooth-btn" alt="Discover Mods" style="height: 4rem; margin-right: 10px; cursor: pointer;">
      </a>      <a href="signup"><img src="sign-up.png" class="smooth-btn" alt="Sign Up" style="height: 4rem; margin-left: 10px; cursor: pointer;"></a>
    </div>
    <a href="about" style="display:block;margin-top:1rem;font-family:'FunkinOptions',sans-serif;font-size:3rem;color:#888;text-decoration:none;text-align:center;letter-spacing:0.05em;" onmouseover="this.style.color='#bbb'" onmouseout="this.style.color='#888'">About the Site</a>
  </div>
  <p class="footer-left" style="position: fixed; bottom: 1rem; left: 1rem; font-family: 'Inconsolata ExtraBold', sans-serif; font-size: 1.25rem; color: #666; z-index: 101;"></p>
  <p class="footer-right" style="position: fixed; bottom: 1rem; right: 1rem; font-family: 'Inconsolata ExtraBold', sans-serif; font-size: 1.25rem; color: #666; z-index: 101; text-align: right;"></p>

  <img id="portrait" draggable="false" style="position: fixed; bottom: 0; right: 0; height: 55vh; z-index: 100; pointer-events: none; user-select: none;">

  <div id="home-top-bar" style="display:none;position:fixed;top:1rem;right:2rem;z-index:5001;align-items:center;gap:1.5rem;">
    <div id="notif-wrap" style="position:relative;">
      <img src="icon-notification.png" style="height:5vh;cursor:pointer;opacity:0.85;transition:transform 0.3s ease-out,opacity 0.2s;" onclick="toggleNotifs()" onmouseover="this.style.opacity='1'" onmouseout="this.style.opacity='0.85'" draggable="false"/>
      <div id="notif-badge" style="display:none;position:absolute;top:-0.4vh;right:-0.4vh;background:#c94040;color:#fff;font-family:'FunkinLingLong',sans-serif;font-size:1.6vh;min-width:2.2vh;height:2.2vh;border-radius:999px;display:flex;align-items:center;justify-content:center;pointer-events:none;padding:0 0.4vh;box-sizing:border-box;"></div>
      <div id="notif-dropdown" style="display:none;position:absolute;top:calc(100% + 1vh);right:0;width:clamp(360px,45vw,560px);height:auto;max-height:60vh;background:#1a1828;border:1px solid #333;border-radius:0.6rem;z-index:9999;overflow:hidden;flex-direction:column;">
        <div style="padding:1.2vh 1.5vh;border-bottom:1px solid #2a2a3a;display:flex;align-items:center;justify-content:space-between;">
          <span style="font-family:'FunkinLingLong',sans-serif;font-size:2.5vh;color:#E1E1E1;">NOTIFICATIONS</span>
          <button onclick="markNotifsRead()" style="background:none;border:none;font-family:'FunkinOptions',sans-serif;font-size:1.8vh;color:#888;cursor:pointer;padding:0;" onmouseover="this.style.color='#ccc'" onmouseout="this.style.color='#888'">Mark all read</button>
        </div>
        <div id="notif-list" style="overflow-y:auto;max-height:50vh;display:flex;flex-direction:column;"></div>
      </div>
    </div>
    <img id="profile-icon-btn" src="icon-profile-out.png" style="height:7vh;cursor:pointer;" onclick="goToProfile()" draggable="false"/>
  </div>

  <script src="api.js"></script>
  <script>
    let _notifs = [];

    async function loadNotifs() {
      const t = localStorage.getItem('token');
      if (!t) return;
      const data = await fetch(`${API}/notifications`, { headers: { 'Authorization': `Bearer ${t}` } }).then(r => r.ok ? r.json() : []).catch(() => []);
      _notifs = data;
      const unread = data.filter(n => !n.read).length;
      const badge = document.getElementById('notif-badge');
      if (unread > 0) { badge.textContent = unread > 99 ? '99+' : unread; badge.style.display = 'flex'; }
      else { badge.style.display = 'none'; }
    }

    function renderNotifs() {
      const list = document.getElementById('notif-list');
      list.innerHTML = '';
      if (!_notifs.length) {
        const empty = document.createElement('p');
        empty.style.cssText = "font-family:'FunkinOptions',sans-serif;font-size:2vh;color:#999;text-align:center;padding:2vh;margin:0;";
        empty.textContent = 'No notifications yet.';
        list.appendChild(empty);
        return;
      }
      _notifs.forEach(n => {
        const row = document.createElement('div');
        row.style.cssText = `display:flex;align-items:center;gap:1.2vh;padding:1.2vh 1.5vh;cursor:pointer;border-bottom:1px solid #2a2a3a;background:${n.read ? 'transparent' : 'rgba(173,0,84,0.08)'};`;
        row.onmouseover = () => row.style.background = n.read ? '#1f1d2e' : 'rgba(173,0,84,0.15)';
        row.onmouseout = () => row.style.background = n.read ? 'transparent' : 'rgba(173,0,84,0.08)';
        const img = document.createElement('img');
        img.src = `${API}/avatars/${n.fromId}.png`;
        img.onerror = () => { img.src = 'https://funkinbackstage.com/icon-profile-out.png'; };
        img.style.cssText = 'height:4.5vh;width:4.5vh;border-radius:50%;object-fit:cover;border:0.4vh solid #E1E1E1;flex-shrink:0;';
        const text = document.createElement('span');
        text.style.cssText = "font-family:'FunkinOptions',sans-serif;font-size:1.9vh;color:#ccc;line-height:1.4;";
        if (n.type === 'follow') {
          text.innerHTML = `<strong style="color:#E1E1E1;">${n.fromUsername}</strong> followed you`;
          row.onclick = () => { window.location.href = `https://funkinbackstage.com/users/${n.fromId}`; };
        } else if (n.type === 'upload') {
          text.innerHTML = `<strong style="color:#E1E1E1;">${n.fromUsername}</strong> uploaded <strong style="color:#E1E1E1;">${n.title}</strong>`;
          row.onclick = () => { window.location.href = `https://funkinbackstage.com/mods/${n.submissionId}`; };
        }
        row.appendChild(img);
        row.appendChild(text);
        list.appendChild(row);
      });
    }

    function toggleNotifs() {
      const dd = document.getElementById('notif-dropdown');
      const open = dd.style.display === 'flex';
      dd.style.display = open ? 'none' : 'flex';
      dd.style.flexDirection = 'column';
      if (!open) { renderNotifs(); markNotifsRead(); }
    }

    async function markNotifsRead() {
      const t = localStorage.getItem('token');
      if (!t) return;
      await fetch(`${API}/notifications/read`, { method: 'POST', headers: { 'Authorization': `Bearer ${t}` } }).catch(() => {});
      _notifs = _notifs.map(n => ({ ...n, read: true }));
      document.getElementById('notif-badge').style.display = 'none';
    }

    document.addEventListener('click', e => {
      const wrap = document.getElementById('notif-wrap');
      if (wrap && !wrap.contains(e.target)) document.getElementById('notif-dropdown').style.display = 'none';
    });
  </script>
  <script>
    (async function() {
      const files = await fetch(`${API}/portraits`).then(r => r.json()).catch(() => []);
      if (!files.length) return;
      const pick = files[Math.floor(Math.random() * files.length)];
      document.getElementById('portrait').src = `${API}/portraits/${pick}`;
    })();
  </script>
  <script>
    async function goToProfile() {
      const t = localStorage.getItem('token');
      if (!t) { window.location.href = 'login'; return; }
      const me = await fetch(`${API}/me`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${t}` }, body: JSON.stringify({}) }).then(r => r.ok ? r.json() : null).catch(() => null);
      if (me?.id) window.location.href = `https://funkinbackstage.com/users/${me.id}`;
    }

    (async function() {
      const token = localStorage.getItem('token');
      if (!token) return;
      const res = await fetch(`${API}/me`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
        body: JSON.stringify({})
      });
      if (!res.ok) return;
      const me = await res.json();

      const signUpBtn = document.querySelector('img[src="sign-up.png"]');
      if (signUpBtn) signUpBtn.closest('a').remove();

      const bar = document.getElementById('home-top-bar');
      bar.style.display = 'flex';
      const btn = document.getElementById('profile-icon-btn');
      const avatarUrl = `${API}/avatars/${me.id}.png`;
      const test = new Image();
      test.onload = () => {
        btn.src = avatarUrl;
        btn.style.borderRadius = '50%';
        btn.style.objectFit = 'cover';
        btn.style.width = '7vh';
        btn.style.border = '0.5vh solid #E1E1E1';
      };
      test.src = avatarUrl;
      loadNotifs();
    })();
  </script>
</body>
</html>
