<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Funkin' Backstage | Mods</title>
		<link rel="icon" type="image/png" href="../favicon.png">
		<link rel="stylesheet" href="../style.css?v=3" type="text/css">
		<link rel="stylesheet" href="style.css?v=3" type="text/css">
		
		<meta property="og:title" content="Funkin' Backstage - Mods" />
		<meta property="og:description" content="Discover community made mods!" />
		<meta property="og:image" content="https://funkinbackstage.com/favicon.png" />
		<style>
			@media (max-width: 768px) {
				#top-bar {
					position: static !important;
					top: unset !important;
					right: unset !important;
					width: 100%;
					justify-content: flex-end;
					padding: 1rem 1rem 0;
					box-sizing: border-box;
				}

				#upload-button {
					padding-top: 0 !important;
					padding-bottom: 0 !important;
				}

				.mod-card {
					overflow: hidden;
				}

				.mod-label {
					margin-top: 0 !important;
					margin-left: 1rem !important;
					margin-right: 1rem !important;
					padding-top: 0.3rem !important;
				}

				.mod-label h1 {
					margin: 0 !important;
					line-height: 1.1 !important;
				}

				.mod-footer {
					left: 1rem !important;
					right: 1rem !important;
				}

				.mod-thumbnail {
					width: 100% !important;
					height: 65% !important;
					object-fit: cover !important;
					margin: 0 !important;
				}

				.mod-box {
					border-image: url('assets/box base.png') 18 fill / 7px stretch !important;
				}

				body > h1 {
					font-size: 3.5rem !important;
				}
			}
		</style>
	</head>

	<body>
		<h1 style="font-family: 'FunkinLingLong', sans-serif; position: fixed; left: 2rem; top: 1rem; margin: 0; line-height: 1; font-size: 6vh;">Mods</h1>
		<div id="filter-panel">
			<div class="mod-box" id="mod-box-1">
				<div class="mod-box-header">
					<h1 id="category-text" style="font-size: 3vh;">CATEGORY - FULL MODS</h1>
					<div style="flex: 1;"></div>
					<img id="category-arrow" draggable="false" src="assets/drop down arrow.png" class="smooth-btn dropdown-arrow" style="height: 2vh; margin-right: 2rem; cursor: pointer;" onclick="toggleBox(this, 'mod-box-1')">
				</div>
				<div class="mod-box-content" style="padding-left: 5%">
					<div style="height: 6px; width: 90%; background-color: #E1E1E1; border-radius: 10px; margin-bottom: 1vh;"></div>
					<h1 style="font-size: 3vh;" class="sort-item" onclick="changeCategoryFilter(this)">Any</h1>
					<h1 style="font-size: 3vh;" class="sort-item" onclick="changeCategoryFilter(this)">Full Mods</h1>
					<h1 style="font-size: 3vh;" class="sort-item" onclick="changeCategoryFilter(this)">Ports</h1>
					<h1 style="font-size: 3vh;" class="sort-item" onclick="changeCategoryFilter(this)">Scripts</h1>
				</div>
			</div>
			<div class="mod-box" id="mod-box-2">
				<div class="mod-box-header">
					<h1 id="engine-text" style="font-size: 3vh;">ENGINE - ANY</h1>
					<div style="flex: 1;"></div>
					<img id="engine-arrow" draggable="false" src="assets/drop down arrow.png" class="smooth-btn dropdown-arrow" style="height: 2vh; margin-right: 2rem; cursor: pointer;" onclick="toggleBox(this, 'mod-box-2')">
				</div>
				<div class="mod-box-content" style="padding-left: 5%">
					<div style="height: 6px; width: 90%; background-color: #E1E1E1; border-radius: 10px; margin-bottom: 1vh;"></div>
					<h1 style="font-size: 3vh;" class="sort-item" onclick="changeEngineFilter(this)">Any</h1>
					<h1 style="font-size: 3vh;" class="sort-item" onclick="changeEngineFilter(this)">Base Game</h1>
					<h1 style="font-size: 3vh;" class="sort-item" onclick="changeEngineFilter(this)">Codename Engine</h1>
					<h1 style="font-size: 3vh;" class="sort-item" onclick="changeEngineFilter(this)">Psych Engine</h1>
					<h1 style="font-size: 3vh;" class="sort-item" onclick="changeEngineFilter(this)">Kade Engine</h1>
					<h1 style="font-size: 3vh;" class="sort-item" onclick="changeEngineFilter(this)">FPS Plus</h1>
					<h1 style="font-size: 3vh;" class="sort-item" onclick="changeEngineFilter(this)">Other</h1>
				</div>
			</div>
			<div class="mod-box" id="mod-box-3">
				<div class="mod-box-header">
					<h1 id="filter-text" style="font-size: 3vh;">FILTERS - 0</h1>
					<div style="flex: 1;"></div>
					<img draggable="false" src="assets/drop down arrow.png" class="smooth-btn dropdown-arrow" style="height: 2vh; margin-right: 2rem; cursor: pointer;" onclick="toggleBox(this, 'mod-box-3')">
				</div>
				<div class="mod-box-content" style="padding-left: 5%">
					<div style="height: 6px; width: 90%; background-color: #E1E1E1; border-radius: 10px; margin-bottom: 1vh;"></div>
					<div style="display: flex; flex-direction: row; align-items: center; gap: 0.75rem; width: 100%">
						<img draggable="false" class="check-box" src="assets/checkbox-empty.png" style="height: 2.5vh; cursor: pointer;" onclick="toggleTick(this); toggleFeaturedFilter()">
						<h1 style="font-size: 3vh; line-height: 1; margin-top: 0.6rem;">Featured</h1>
					</div>
					<div style="display: flex; flex-direction: row; align-items: center; gap: 0.75rem; width: 100%">
						<img draggable="false" class="check-box" src="assets/checkbox-empty.png" style="height: 2.5vh; cursor: pointer;" onclick="toggleTick(this); toggleLikedFilter()">
						<h1 style="font-size: 3vh; line-height: 1; margin-top: 0.6rem;">Liked</h1>
					</div>
					<div style="display: flex; flex-direction: row; align-items: center; gap: 0.75rem; width: 100%">
						<img draggable="false" class="check-box" src="assets/checkbox-empty.png" style="height: 2.5vh; cursor: pointer;" onclick="toggleTick(this); toggleUnapprovedFilter()">
						<h1 style="font-size: 3vh; line-height: 1; margin-top: 0.6rem;">Unapproved</h1>
					</div>
				</div>
			</div>
			<div class="mod-box" id="mod-box-sort">
				<div class="mod-box-header">
					<h1 id="sort-text" style="font-size: 3vh;">SORT - ACTIVITY</h1>
					<div style="flex: 1;"></div>
					<img id="sort-arrow" draggable="false" src="assets/drop down arrow.png" class="smooth-btn dropdown-arrow" style="height: 2vh; margin-right: 1rem; cursor: pointer;" onclick="toggleBox(this, 'mod-box-sort')">
					<img id="sort-arrow" draggable="false" src="assets/sort-direction.png" class="smooth-btn dropdown-arrow" style="height: 2vh; margin-right: 1rem; cursor: pointer;" onclick="toggleDirection(this)">
				</div>
				<div class="mod-box-content" style="padding-left: 5%">
					<div style="height: 6px; width: 90%; background-color: #E1E1E1; border-radius: 10px; margin-bottom: 1vh;"></div>
					<h1 style="font-size: 3vh;" class="sort-item" onclick="changeSort(this)">Activity</h1>
					<h1 style="font-size: 3vh;" class="sort-item" onclick="changeSort(this)">Downloads</h1>
					<h1 style="font-size: 3vh;" class="sort-item" onclick="changeSort(this)">Likes</h1>
					<h1 style="font-size: 3vh;" class="sort-item" onclick="changeSort(this)">Views</h1>
					<h1 style="font-size: 3vh;" class="sort-item" onclick="changeSort(this)">Date Added</h1>
					<h1 style="font-size: 3vh;" class="sort-item" onclick="changeSort(this)">Stars</h1>
				</div>
			</div>
		</div>
		<div id="mod-grid-container" style="position: fixed; top: calc(6rem + 7vh + 1.5rem); left: 2rem; right: 1.2rem; bottom: 3rem; overflow-y: auto; overflow-x: hidden;">
			<div id="mod-grid"></div>
		</div>
		<div class="mod-box" id="search-box" style="position: fixed; top: 6rem; left: 2rem; right: calc(2rem + 12vw + 1rem); flex-direction: row; align-items: center; height: 7vh; padding: 0 1.5rem 0 3rem; gap: 0.75rem;">
			<img draggable="false" src="assets/icon-search.png" style="height: 2.5vh; opacity: 0.7; flex-shrink: 0;">
			<input type="text" id="search-input" placeholder="SEARCH" oninput="applySearch(this.value)" style="background: transparent; border: none; outline: none; font-family: 'FunkinLingLong', sans-serif; font-size: 3vh; color: #E1E1E1; width: 100%; caret-color: #E1E1E1; margin-top: 0.2rem;" />
		</div>
		<div id="filter-toggle" class="mod-box smooth-btn" onclick="toggleFilters()" style="position: fixed; top: 6rem; right: 2rem; width: 12vw; flex-direction: row; align-items: center; justify-content: center; cursor: pointer;">
			<h1 id="filter-toggle-text" style="font-size: 2.2vh; color: #E1E1E1;">FILTERS/SORTS</h1>
		</div>
		<script src="../api.js?v=3"></script>
		<script src="scripts/main.js"></script>
		<p class="footer-left" style="position: fixed; bottom: 1rem; left: 1rem; font-family: 'Inconsolata ExtraBold', sans-serif; font-size: 1.25rem; color: #666;"></p>
		<p class="footer-right" style="position: fixed; bottom: 1rem; right: 1rem; font-family: 'Inconsolata ExtraBold', sans-serif; font-size: 1.25rem; color: #666; text-align: right;"></p>
		<div id="top-bar" style="position: fixed; top: 1rem; right: 2rem; font-family: 'Inconsolata ExtraBold', sans-serif; font-size: 1.25rem; color: #666; text-align: right; display: flex; align-items: center; gap: 2rem;">
			<div class="mod-box smooth-btn" id="upload-button" onclick="window.location.href='../upload'" style="display: flex; flex-direction: row; align-items: center; gap: 1rem; height: 5vh; transition: transform 0.3s ease-out, height 0.3s ease; cursor: pointer;">
				<h1 style="font-size: 2.5vh; color: #E1E1E1; margin-top: 0.3vh">UPLOAD</h1>
				<img src="../icon-upload.png" style="height: 2.5vh; width: 2.5vh; margin-top: -0.4rem; margin-right: 0.6rem"/>
			</div>
			<img class="smooth-btn" id="profile-icon-btn" src="../icon-profile-out.png" style="transition: transform 0.3s ease-out, height 0.3s ease; height: 7vh; cursor: pointer;" onclick="goToProfile()"/>
		</div>
		<script>
			async function loadProfileIcon() {
				const t = localStorage.getItem('token');
				if (!t) return;
				const me = await fetch(`${API}/me`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${t}` }, body: JSON.stringify({}) }).then(r => r.ok ? r.json() : null).catch(() => null);
				if (!me?.id) return;
				const icon = document.getElementById('profile-icon-btn');
				const fallback = icon.src;
				icon.onload = () => { if (icon.src.includes('/avatars/')) icon.classList.add('has-avatar'); };
				icon.onerror = () => { icon.classList.remove('has-avatar'); icon.src = fallback; };
				icon.src = `${API}/avatars/${me.id}.png?t=${Date.now()}`;
			}

			async function goToProfile() {
				const t = localStorage.getItem('token');
				if (!t) { window.location.href = '../login'; return; }
				const me = await fetch(`${API}/me`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${t}` }, body: JSON.stringify({}) }).then(r => r.ok ? r.json() : null).catch(() => null);
				if (me?.id) { sessionStorage.setItem('userId', me.id); window.location.href = '../users/view/'; }
			}

			const _token = localStorage.getItem('token');
			if (!_token) {
				const bar = document.getElementById('top-bar');
				bar.innerHTML = `
					<div class="mod-box smooth-btn" onclick="window.location.href='../signup'" style="display:flex;flex-direction:row;align-items:center;gap:1rem;height:5vh;transition:transform 0.3s ease-out;cursor:pointer;">
						<h1 style="font-size:2.5vh;color:#E1E1E1;margin-top:0.3vh;padding:0 1rem;">SIGN UP</h1>
					</div>
				`;
			}
			loadProfileIcon();
		</script>
	</body>
</html>
