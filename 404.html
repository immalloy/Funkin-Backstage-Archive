<!DOCTYPE html>
<html lang="en" style="background:black">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Funkin' Backstage</title>
	<link rel="icon" type="image/png" href="/favicon.png">
	<link rel="stylesheet" href="/style.css">
	<style>
		#profile-header {
			width: 100%;
			height: 25vh;
			background: #484660;
			border-bottom: 2px solid #E1E1E1;
			display: flex;
			align-items: center;
			gap: 2rem;
			padding: 2rem 3rem;
			box-sizing: border-box;
		}
		#profile-avatar {
			height: 100%;
			aspect-ratio: 1;
			border-radius: 50%;
			object-fit: cover;
			flex-shrink: 0;
			background: #333;
			border: 0.4vh solid #E1E1E1;
		}
		#profile-info {
			display: flex;
			flex-direction: column;
			gap: 0.3rem;
			min-width: 0;
		}
		#profile-username {
			font-family: 'FunkinLingLong', sans-serif;
			font-size: 6vh;
			color: #E1E1E1;
			margin: 0;
			line-height: 1;
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
		}
		#profile-bio {
			font-family: 'FunkinOptions', sans-serif;
			font-size: 1.8vh;
			color: #bbb;
			margin: 0;
			font-style: italic;
		}
	</style>
	<script>
		var path = window.location.pathname;
		var modsMatch = path.match(/^\/mods\/([^/]+)\/?$/);
		if (modsMatch) {
			sessionStorage.setItem('modId', modsMatch[1]);
			window.location.replace('/mods/view/');
		}
	</script>
</head>
<body style="display:block !important; padding:0; margin:0;">
	<script>
		(function () {
			var path = window.location.pathname;
			var usersMatch = path.match(/^\/users\/([^/]+)\/?$/);
			if (!usersMatch) return;

			var userId = Number(usersMatch[1]);
			document.title = 'Profile — Funkin\' Backstage';

			var header = document.createElement('div');
			header.id = 'profile-header';

			var avatar = document.createElement('img');
			avatar.id = 'profile-avatar';
			avatar.draggable = false;

			var info = document.createElement('div');
			info.id = 'profile-info';

			var username = document.createElement('h1');
			username.id = 'profile-username';
			username.textContent = '...';

			var bio = document.createElement('p');
			bio.id = 'profile-bio';

			info.appendChild(username);
			info.appendChild(bio);
			header.appendChild(avatar);
			header.appendChild(info);
			document.body.appendChild(header);

			var apiScript = document.createElement('script');
			apiScript.src = '/api.js';
			apiScript.onload = function () {
				fetch(API + '/users/' + userId)
					.then(function (r) { return r.ok ? r.json() : null; })
					.then(function (user) {
						if (!user) { username.textContent = 'User not found'; return; }
						document.title = user.username + ' — Funkin\' Backstage';
						username.textContent = user.username;
						bio.textContent = user.bio ? '"' + user.bio + '"' : '';
						avatar.src = API + '/avatars/' + userId + '.png';
						avatar.onerror = function () { avatar.src = ''; avatar.style.background = '#444'; };
					});
			};
			document.head.appendChild(apiScript);
		})();
	</script>
</body>
</html>
