<!DOCTYPE html>
<html lang="en" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Funkin' Backstage | Global Chat</title>

  <meta property="og:title" content="Funkin' Backstage - Global Chat" />
  <meta property="og:description" content="For Modders. By Modders." />
  <meta property="og:image" content="https://funkinbackstage.com/favicon.png" />
  <meta name="theme-color" content="#ad0054" />

  <link rel="icon" type="image/png" href="../favicon.png">
  <link rel="stylesheet" href="../style.css" type="text/css">
  <link rel="stylesheet" href="style.css" type="text/css">
  <link rel="stylesheet" href="css/index.css?v=3">
</head>
<body class="chat-body">
    <div id="header-container">
        <h1 class="chat-title">Global Chat</h1>
        <span id="active-count">• 0 active</span>
    </div>
    <div class="ui-box" id="chat-box">
        <div id="chat-scroll">
            <div id="chat-loading" role="status" aria-live="polite">Loading chat…</div>
        </div>
        <div id="scroll-track">
            <div id="scroll-thumb"></div>
        </div>
    </div>
    <div class="ui-box chat-input-box">
        <div id="mention-suggestions" role="listbox"></div>
        <input type="text" id="chat-bar" placeholder="Type something to send..." autocomplete="off" aria-autocomplete="list" oninput="filterChatInput(this); updateMentionSuggestions()" onkeydown="handleChatKeydown(event)"/>
        <div class="chat-icon-wrap">
            <div id="sticker-bubble">
            </div>
            <img id="sticker-icon" src="assets/icon-sticker.png" class="smooth-btn" onclick="toggleStickerBubble()"/>
        </div>
        <img id="send-icon" src="assets/icon-send.png" class="smooth-btn" onclick="sendMessage()"/>
    </div>
</body>

<div class="top-right-wrap">
	<div id="notif-wrap">
		<img src="../icon-notification.png" class="notif-icon" onclick="toggleNotifs()" onmouseover="this.style.opacity='1'" onmouseout="this.style.opacity='0.85'" draggable="false"/>
		<div id="notif-badge"></div>
		<div id="notif-dropdown">
			<div class="notif-header">
				<span class="notif-title">NOTIFICATIONS</span>
				<button onclick="markNotifsRead()" class="notif-mark-read" onmouseover="this.style.color='#ccc'" onmouseout="this.style.color='#888'">Mark all read</button>
			</div>
			<div id="notif-list"></div>
		</div>
	</div>
	<img class="smooth-btn" id="profile-icon-btn" src="../icon-profile-out.png" onclick="goToOwnProfile()" draggable="false"/>
</div>

<p class="footer-left"></p>
<p class="footer-right"></p>

<script src="../api.js?v=2"></script>
<script src="chat.js?v=3"></script>

</html>
