<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Funkin' Backstage | Global Chat</title>

  <meta property="og:title" content="Funkin' Backstage - Global Chat" />
  <meta property="og:description" content="For Modders. By Modders." />
  <meta property="og:image" content="https://funkinbackstage.com/favicon.png" />
  <meta name="theme-color" content="#ad0054" />

  <link rel="icon" type="image/png" href="../favicon.png">
  <link rel="stylesheet" href="../style.css" type="text/css">
  <link rel="stylesheet" href="style.css" type="text/css">
  <style>
    #chat-scroll {
      scrollbar-width: none;
    }
    #chat-scroll::-webkit-scrollbar {
      display: none;
    }
    #scroll-track {
      width: 40px;
      height: 100%;
      flex-shrink: 0;
      position: relative;
      background-image: url('scroll-bar-bg.png');
      background-repeat: no-repeat;
      background-size: auto 100%;
      background-position: center;
      cursor: pointer;
    }
    #scroll-thumb {
      position: absolute;
      width: 80px;
      height: 80px;
      left: 50%;
      transform: translateX(-50%);
      background-image: url('scroll-bar-track.png');
      background-repeat: no-repeat;
      background-size: contain;
      background-position: center;
      cursor: grab;
    }
    #scroll-thumb:active {
      cursor: grabbing;
    }

    .sticker-in-bubble {
        width: calc((40vh - 4vh - 3 * 1vh) / 4);
        height: calc((40vh - 4vh - 3 * 1vh) / 4);
        object-fit: contain;
        flex-shrink: 0;
    }
    .sticker-in-bubble:hover {
        cursor: pointer;
    }

    .chat-username {
        font-family: 'FunkinOptions', sans-serif;
        font-size: 3vh;
        margin-top: 1.5vh;
        color: #BABABA;
        text-decoration: none;
        cursor: pointer;
        background: none;
        border: none;
        padding: 0;
    }
    .chat-username:hover { text-decoration: underline; }

    @media (max-width: 768px) {
      html, body {
        overflow-x: hidden;
        overflow-y: auto;
      }
      body {
        align-items: stretch !important;
        justify-content: flex-start !important;
        padding: 2vh 4vw !important;
        gap: 1.5vh !important;
        min-height: 100vh;
      }
      body > div:first-child {
        gap: 1.5vw;
        flex-wrap: wrap;
      }
      body > div:first-child h1 {
        font-size: 6vh !important;
      }
      #active-count {
        font-size: 2vh !important;
        margin-bottom: 0 !important;
      }
      #chat-box {
        width: 100% !important;
        height: 55vh !important;
      }
      #scroll-track {
        display: none !important;
      }
      #chat-scroll {
        scrollbar-width: thin !important;
      }
      #chat-scroll::-webkit-scrollbar {
        display: block !important;
        width: 4px;
      }
      #chat-scroll::-webkit-scrollbar-thumb {
        background: rgba(255,255,255,0.3);
        border-radius: 2px;
      }
      body > .ui-box:last-of-type {
        width: 100% !important;
      }
      #sticker-bubble {
        right: 0 !important;
        width: 28vh !important;
        height: 28vh !important;
      }
      #chat-scroll h1 {
        font-size: 2.8vh !important;
      }
      #chat-scroll h1:last-child {
        font-size: 3.2vh !important;
      }
      .sticker-in-bubble {
        width: calc((28vh - 4vh - 4 * 1vh) / 5) !important;
        height: calc((28vh - 4vh - 4 * 1vh) / 5) !important;
      }
      .footer-left, .footer-right {
        font-size: 0.75rem !important;
      }
    }
  </style>
</head>
<body style="display: flex; flex-direction: column; gap: 3vh; justify-content: center; background-image: url('bg.png'); background-size: cover; background-position: center; background-attachment: fixed;">
    <div style="display: flex; align-items: center; gap: 2vh;">
        <h1 style="font-family: 'FunkinLingLong', sans-serif; font-size: 10vh;">Global Chat</h1>
        <span id="active-count" style="font-family: 'FunkinOptions', sans-serif; font-size: 2.5vh; align-self: center; margin-bottom: 0.5rem; color: #BABABA">• 0 active</span>
    </div>
    <div class="ui-box" id="chat-box" style="width: 100rem; height: 65vh; padding-top: 0.9rem; padding-bottom: 0.8rem; display: flex; flex-direction: row; align-items: flex-start; gap: 0;">
        <div id="chat-scroll" style="flex: 1; height: 100%; overflow-y: scroll; display: flex; flex-direction: column; gap: 2vh; padding: 1vh;">
        </div>
        <div id="scroll-track">
            <div id="scroll-thumb"></div>
        </div>
    </div>
    <div class="ui-box" style="width: 100rem; height: 1rem; gap: 3vh; position: relative;">
        <input type="text" id="chat-bar" placeholder="Type something to send..." style="background: transparent; border: none; outline: none; font-family: 'FunkinOptions', sans-serif; font-size: 4vh; color: #E1E1E1; width: 100%; caret-color: #E1E1E1; margin-top: 1vh;" onkeydown="if(event.key==='Enter')sendMessage()"/>
        <div style="position: relative; flex-shrink: 0;">
            <div id="sticker-bubble" style="display: none; position: absolute; bottom: 0; right: 0; background-image: url('sticker-bubble.png'); background-size: contain; background-repeat: no-repeat; width: 40vh; height: 40vh; padding: 2vh; gap: 1vh; flex-wrap: wrap; align-content: flex-start; overflow-y: auto;">
            </div>
            <img src="icon-sticker.png" class="smooth-btn" style="width: 3.5vh; height: 4vh; margin-left: auto; cursor: pointer;" onclick="toggleStickerBubble()"/>
        </div>
        <img src="icon-send.png" class="smooth-btn" style="width: 4vh; height: 4vh; margin-left: auto; flex-shrink: 0; cursor: pointer;" onclick="sendMessage()"/>
    </div>
</body>

<img class="smooth-btn" src="../icon-profile-out.png" onclick="goToOwnProfile()" style="position:fixed;top:1rem;right:2rem;height:7vh;cursor:pointer;transition:transform 0.3s ease-out;z-index:101;" draggable="false"/>

<p class="footer-left" style="position: fixed; bottom: 1rem; left: 1rem; font-family: 'Inconsolata ExtraBold', sans-serif; font-size: 1.25rem; color: #666; z-index: 101;"></p>
<p class="footer-right" style="position: fixed; bottom: 1rem; right: 1rem; font-family: 'Inconsolata ExtraBold', sans-serif; font-size: 1.25rem; color: #666; z-index: 101; text-align: right;"></p>

<script src="../api.js"></script>
<script>
    // ── Current user ────────────────────────────────────────────────────────
    let currentUser = null;
    (async () => {
        const token = localStorage.getItem('token');
        if (!token) return;
        const res = await fetch(`${API}/me`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }, body: JSON.stringify({}) }).catch(() => null);
        if (res?.ok) currentUser = await res.json();
    })();

    // ── Caches ──────────────────────────────────────────────────────────────
    const avatarCache = new Map(); // userId → boolean (has custom avatar)
    const userCache   = new Map(); // userId → { id, username, ... }

    async function getUser(userId) {
        if (!userCache.has(userId)) {
            const u = await fetch(`${API}/users/${userId}`).then(r => r.json()).catch(() => ({ id: userId, username: '?' }));
            userCache.set(userId, u);
            // Prime avatar cache while we're here
            if (!avatarCache.has(userId)) {
                const res = await fetch(`${API}/avatars/${userId}.png`, { method: 'HEAD' }).catch(() => ({ ok: false }));
                avatarCache.set(userId, res.ok);
            }
        }
        return userCache.get(userId);
    }

    function getAvatarSrc(userId) {
        return avatarCache.get(userId) ? `${API}/avatars/${userId}.png` : '../icon-profile-out.png';
    }

    let stickerListCache = null;
    async function getStickers() {
        if (!stickerListCache) {
            const files = await fetch(`${API}/stickers`).then(r => r.json());
            stickerListCache = files.map(f => `${f}`.replace('.png', ''));
        }
        return stickerListCache;
    }

    // ── Scroll bar ──────────────────────────────────────────────────────────
    const scrollEl = document.getElementById('chat-scroll');
    const track = document.getElementById('scroll-track');
    const thumb = document.getElementById('scroll-thumb');

    const THUMB_H = 85;
    function updateThumb() {
        const trackH = track.clientHeight;
        const scrollRange = scrollEl.scrollHeight - scrollEl.clientHeight;
        const thumbTop = scrollRange > 0 ? (scrollEl.scrollTop / scrollRange) * (trackH - THUMB_H) : 0;
        thumb.style.top = thumbTop + 'px';
    }

    scrollEl.addEventListener('scroll', updateThumb);

    let dragging = false, startY = 0, startScrollTop = 0;
    thumb.addEventListener('mousedown', e => {
        dragging = true;
        startY = e.clientY;
        startScrollTop = scrollEl.scrollTop;
        e.preventDefault();
    });
    document.addEventListener('mousemove', e => {
        if (!dragging) return;
        const dy = e.clientY - startY;
        const trackH = track.clientHeight;
        const scrollRange = scrollEl.scrollHeight - scrollEl.clientHeight;
        scrollEl.scrollTop = startScrollTop + (dy / (trackH - THUMB_H)) * scrollRange;
    });
    document.addEventListener('mouseup', () => { dragging = false; });

    track.addEventListener('click', e => {
        if (e.target === thumb) return;
        const rect = track.getBoundingClientRect();
        const ratio = (e.clientY - rect.top) / track.clientHeight;
        scrollEl.scrollTop = ratio * scrollEl.scrollHeight;
    });

    // ── Rendering helpers ───────────────────────────────────────────────────
    function escapeHTML(text) {
        return text.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
    }

    function normalize(str) {
        return str.toLowerCase()
            .replace(/0/g,'o').replace(/1/g,'i').replace(/3/g,'e')
            .replace(/4/g,'a').replace(/5/g,'s').replace(/8/g,'b')
            .replace(/@/g,'a').replace(/\$/g,'s').replace(/[^a-z]/g,'');
    }

    async function buildMessageHTML(message) {
        const stickerList = await getStickers();
        const user = await getUser(message.poster);
        const hasAvatar = avatarCache.get(user.id);
        const avatarSrc = getAvatarSrc(user.id);
        let content = escapeHTML(`${message.contents}`.trim());
        const stickerOnly = content.startsWith(':') && content.endsWith(':');
        for (const sticker of stickerList) {
            content = content.replaceAll(`:${sticker}:`, `<img src="${API}/stickers/${sticker}.png" style="height:${stickerOnly ? '13' : '5'}vh;${stickerOnly ? '' : 'margin:1vh;margin-top:0.5vh;'}"/>`);
        }
        const isMentioned = currentUser && new RegExp(`@${currentUser.username}`, 'i').test(message.contents);
        const badgeHTML = user.id === 2
            ? `<img src="https://files.funkinbackstage.com/badges/owner-badge.png" style="height:2.5vh;margin-top:1vh;" draggable="false">`
            : (user.isAdmin ? `<img src="https://files.funkinbackstage.com/badges/mod-badge.png" style="height:2.5vh;margin-top:1vh;" draggable="false">` : '');
        return `<div style="display:flex;flex-direction:column;align-items:flex-start;gap:0rem;justify-content:start;${isMentioned ? 'background:rgba(80,130,255,0.15);border-left:3px solid #5082ff;border-radius:0.4rem;padding:0.3rem 0.6rem;margin:-0.3rem -0.6rem;' : ''}">
            <div style="display:flex;justify-content:flex-start;align-items:center;gap:0.5vw">
                <div style="position:relative;height:4vh;width:4vh;flex-shrink:0;">
                    <img src="${avatarSrc}" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);height:${hasAvatar ? '3.5' : '4'}vh;width:${hasAvatar ? '3.5' : '4'}vh;border-radius:50%;object-fit:cover;"/>
                    ${hasAvatar ? `<img src="../icon-profile-in.png" style="position:absolute;top:0;left:0;height:4vh;width:4vh;"/>` : ''}
                </div>
                <button class="chat-username" onclick="goToUserProfile(${user.id})">${escapeHTML(user.username)}</button>
                ${badgeHTML}
                ${message.timestamp ? `<h1 style="font-family:'FunkinOptions',sans-serif;font-size:2vh;margin-top:1.5vh;color:#999;white-space:nowrap;">• ${new Date(message.timestamp).toLocaleTimeString([],{hour:'numeric',minute:'2-digit',hour12:true}).toLowerCase()}</h1>` : ''}
            </div>
            <h1 style="font-family:'FunkinOptions',sans-serif;font-size:4vh;margin:0;display:flex;align-items:center;font-weight:normal">${content}</h1>
        </div>`;
    }

    function scrollToBottom(box, andWaitForImages = false) {
        if (!andWaitForImages) { box.scrollTop = box.scrollHeight; updateThumb(); return; }
        const imgs = Array.from(box.querySelectorAll('img'));
        const pending = imgs.filter(img => !img.complete);
        if (!pending.length) { box.scrollTop = box.scrollHeight; updateThumb(); return; }
        let done = 0;
        const settle = () => { if (++done >= pending.length) { box.scrollTop = box.scrollHeight; updateThumb(); } };
        pending.forEach(img => { img.addEventListener('load', settle); img.addEventListener('error', settle); });
    }

    // ── Full reload (on page load / 30s sync) ──────────────────────────────
    let updating = false;
    async function updateTheMessages(doScroll = false) {
        if (updating) return;
        updating = true;
        try {
            const all = await fetch(`${API}/chat/read`).then(r => r.json());
            const messages = all.slice(-25);
            let out = '';
            for (const msg of messages) out += await buildMessageHTML(msg);
            const box = document.getElementById('chat-scroll');
            box.innerHTML = out;
            if (doScroll) scrollToBottom(box, true); else updateThumb();
        } finally { updating = false; }
    }

    // ── Append a single new message (called by WebSocket push) ────────────
    async function appendMessage(message) {
        const box = document.getElementById('chat-scroll');
        const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
        const html = await buildMessageHTML(message);
        const div = document.createElement('div');
        div.innerHTML = html;
        const node = div.firstElementChild;
        box.appendChild(node);
        // Keep at most 25 children visible
        while (box.children.length > 25) box.removeChild(box.firstElementChild);
        if (atBottom) scrollToBottom(box, true); else updateThumb();
    }

    // ── Active user ping ────────────────────────────────────────────────────
    if (!sessionStorage.getItem('chatSessionId'))
        sessionStorage.setItem('chatSessionId', Math.random().toString(36).slice(2));
    const chatSessionId = sessionStorage.getItem('chatSessionId');

    function pingServer() {
        fetch(`${API}/chat/ping`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ sessionId: chatSessionId }) });
    }
    pingServer();
    setInterval(pingServer, 5000);

    const countStream = new EventSource(`${API}/chat/count-stream`);
    countStream.onmessage = e => {
        document.getElementById('active-count').innerHTML = `<a style="color:#00FF00;">•</a> ${e.data} active`;
    };

    // ── WebSocket ───────────────────────────────────────────────────────────
    let ws = null;
    let wsReady = false;

    function connectWS() {
        const token = localStorage.getItem('token');
        const wsBase = API.replace(/^https?/, m => m === 'https' ? 'wss' : 'ws');
        const url = token ? `${wsBase}/chat/ws?token=${encodeURIComponent(token)}` : `${wsBase}/chat/ws`;
        ws = new WebSocket(url);

        ws.addEventListener('open', () => { wsReady = true; });
        ws.addEventListener('close', () => {
            wsReady = false;
            // Reconnect after 3 seconds
            setTimeout(connectWS, 3000);
        });
        ws.addEventListener('error', () => ws.close());
        ws.addEventListener('message', e => {
            try {
                const msg = JSON.parse(e.data);
                if (msg.type === 'message') appendMessage(msg.data);
            } catch {}
        });
    }

    // ── Profile navigation ─────────────────────────────────────────────────
    function goToUserProfile(userId) {
        sessionStorage.setItem('userId', userId);
        window.location.href = `https://funkinbackstage.com/users/${userId}`;
    }

    async function goToOwnProfile() {
        const t = localStorage.getItem('token');
        if (!t) { window.location.href = '../login'; return; }
        const me = await fetch(`${API}/me`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${t}` }, body: JSON.stringify({}) }).then(r => r.ok ? r.json() : null).catch(() => null);
        if (me?.id) goToUserProfile(me.id);
    }

    // ── Sticker / input helpers ────────────────────────────────────────────
    function addSticker(id) {
        document.getElementById('chat-bar').value += `:${id}: `;
        toggleStickerBubble();
        document.getElementById('chat-bar').focus();
    }

    function toggleStickerBubble() {
        const bubble = document.getElementById('sticker-bubble');
        bubble.style.display = bubble.style.display === 'none' ? 'flex' : 'none';
    }

    async function isBlacklisted(text) {
        const raw = await fetch(`${API}/word-blacklist`).then(r => r.text());
        const words = raw.split('\n').map(w => normalize(w.trim())).filter(Boolean);
        const htmlRegex = /<\/?[a-z][\s\S]*>/i;
        if (htmlRegex.test(text)) return true;
        return words.some(w => normalize(text).includes(w));
    }

    // ── Send ────────────────────────────────────────────────────────────────
    async function sendMessage() {
        const contents = document.getElementById('chat-bar').value.trim();
        if (!contents) return;
        if (await isBlacklisted(contents)) { document.getElementById('chat-bar').value = ''; return; }
        const token = localStorage.getItem('token');
        if (!token) { window.location.href = '../login'; return; }

        document.getElementById('chat-bar').value = '';

        if (wsReady && ws && ws.readyState === WebSocket.OPEN) {
            // Fast path: send over WebSocket — server will broadcast back to everyone
            ws.send(JSON.stringify({ type: 'send', contents }));
        } else {
            // Fallback: HTTP POST
            await fetch(`${API}/chat/send`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify({ contents })
            });
            await updateTheMessages(true);
        }
    }

    async function populateStickerBubble() {
        const stickers = await getStickers();
        const bubble = document.getElementById('sticker-bubble');
        stickers.filter(name => name !== 'true').forEach(name => {
            const img = document.createElement('img');
            img.id = name;
            img.className = 'sticker-in-bubble smooth-btn';
            img.src = `${API}/stickers/${name}.png`;
            img.onclick = () => addSticker(name);
            bubble.insertBefore(img, bubble.firstChild);
        });
    }

    updateTheMessages(true);
    connectWS();
    populateStickerBubble();
    setInterval(() => updateTheMessages(false), 30000);
</script>

</html>
